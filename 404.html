<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Connection Refused</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0f11'/%3E%3Ctext x='7' y='22' font-family='monospace' font-size='16' fill='%23f5a623'%3E%3E_%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;min-height:100vh;background:#0c0f11;color:#f2efe9;
    font-family:'IBM Plex Mono',monospace;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .box{max-width:520px;}
  .code{font-family:'Space Grotesk',sans-serif;font-size:clamp(56px,12vw,96px);font-weight:600;color:#f5a623;line-height:1;margin-bottom:12px;}
  .msg{font-size:15px;color:#8d9399;line-height:1.7;margin-bottom:28px;}
  .msg .hi{color:#5fd9c8;}
  a{
    display:inline-block;font-size:13.5px;color:#0c0f11;background:#f5a623;text-decoration:none;
    padding:12px 20px;border-radius:3px;font-weight:600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="msg">
      <span class="hi">$</span> curl this-page<br>
      &gt; connection refused — target not found on this host.
    </div>
    <a href="/">cd ~ && return home</a>
  </div>
</body>
</html>
